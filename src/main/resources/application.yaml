spring:
  application:
    name: nexus
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-sonnet-5-5
    retry:
      max-attempts: 3
      on-http-codes: 429
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 10s
  http:
    client:            # Spring Boot 4 ; en Boot 3.x c'est "client" (sans s)
      connect-timeout: 10s
      read-timeout: 120s

nexus:
  ai:
    primary: openai
    fallback: anthropic
    fallback-enabled: true
    prompts:
      ask-system: classpath:prompts/ask/system-v2.st
      ask-version: ask-system-v2
    pricing:            # USD par million de tokens
      models:
        gpt-4o-mini:
          input-per-million: 0.15
          output-per-million: 0.60

logging:
  structured:
    format:
      console: ecs      # affiche les addKeyValue(...) des logs
